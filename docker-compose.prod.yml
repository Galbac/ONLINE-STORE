services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:-localhost}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
      - media_prod_data:/app/media:ro
    depends_on:
      - api
    networks:
      - grocery_store_prod

  certbot:
    image: certbot/certbot:v3.1.0
    restart: unless-stopped
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet && docker kill -s HUP $$(docker ps -q -f name=nginx) 2>/dev/null || true; sleep 12h & wait $${!}; done'"
    networks:
      - grocery_store_prod

  frontend:
    image: grocerystore-front-prod
    build:
      context: ../GroceryStore-front
      dockerfile: Dockerfile
      target: runner
      args:
        DOMAIN_NAME: ${DOMAIN_NAME:-localhost}
        NEXT_PUBLIC_API_URL: https://${DOMAIN_NAME:-localhost}
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:8000
      NEXT_PUBLIC_API_URL: https://${DOMAIN_NAME:-localhost}
      DOMAIN_NAME: ${DOMAIN_NAME:-localhost}
    expose:
      - "3000"
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - grocery_store_prod

  api:
    image: grocerystore-api-prod
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-public.ecr.aws/docker/library/python:3.12-slim}
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-grocery_store}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MEDIA_ROOT: /app/media
      MEDIA_URL: /media
    expose:
      - "8000"
    volumes:
      - media_prod_data:/app/media
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - grocery_store_prod

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - grocery_store_prod

  postgres:
    image: ${POSTGRES_IMAGE:-public.ecr.aws/docker/library/postgres:16-alpine}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-grocery_store}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - grocery_store_prod

  db_backup:
    image: ${POSTGRES_IMAGE:-public.ecr.aws/docker/library/postgres:16-alpine}
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-grocery_store}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-6}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./scripts/backup_runner.sh:/backup_runner.sh:ro
      - ./backups/postgres:/backups
    entrypoint: ["/bin/sh", "/backup_runner.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - grocery_store_prod

volumes:
  postgres_prod_data:
  redis_prod_data:
  media_prod_data:
  certbot_conf:
  certbot_www:

networks:
  grocery_store_prod:
    name: grocery_store_prod
    driver: bridge
